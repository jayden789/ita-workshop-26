version: '3'

services:
  db:
    image: postgres:10.5-alpine
    expose:
      - '5432'
  caddy:
    build: ./caddy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - backend_static:/app/static
      - $HOME/caddycerts:/etc/caddycerts
    environment:
      - ACME_AGREE=true
      - CADDYPATH=/etc/caddycerts
    depends_on:
      - backend
  backend:
    build:
      context: ../..
      dockerfile: ./compose/prod/backend/Dockerfile
    volumes:
      - backend_static:/app/static
      - ./logs:/app/logs
    expose:
      - '8000'
    command: /start
    env_file:
      - ../../envs/prod/django.env
    depends_on:
      - db

volumes:
  backend_static:
