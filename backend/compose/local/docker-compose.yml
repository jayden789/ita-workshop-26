version: '3'

services:
  db:
    image: postgres:10.5-alpine
    expose:
      - '5432'
  caddy:
    build: ./caddy
    ports:
      - '8080:8080'
    volumes:
      - backend_static:/app/static
      - ./caddy/resolv.conf:/etc/resolv.conf
    depends_on:
      - backend
  backend:
    build:
      context: ../..
      dockerfile: ./compose/local/backend/Dockerfile
    volumes:
      - ./logs:/app/logs
      - ../..:/app
      - backend_static:/app/static
    expose:
      - '8000'
    command: /start
    env_file:
      - ../../envs/local/django.env
    depends_on:
      - db

volumes:
  backend_static:
