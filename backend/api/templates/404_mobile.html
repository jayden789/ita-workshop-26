<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      background-color: white;
    }

    h1 {
      font-size: 2em;
      margin-top: 1em;
      font-weight: bold;
      color: #1c1c1e;
    }

    p {
      margin-top: 1em;
      font-size: 1.2em;
      color: #1c1c1e;
    }

    .error-illustration {
      width: 300px;
      margin-top: 2em;
    }

    .error-message {
      color: #1c1c1e;
      font-size: 1.5em;
      margin-top: 2em;
    }
  </style>
</head>
<body>
  <div class="container">
    <img
      class="error-illustration"
      src="../../../frontend/assets/404.svg"
      alt="404 error illustration"
    />
    <p class="error-message">This page is broken, Sorry about that!</p>
  </div>
</body>
</html>
